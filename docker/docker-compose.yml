version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: magentic-ui-backend
    ports:
      - "8081:8081"       
    environment:
      - _HOST=0.0.0.0
      - _PORT=8081
      - MAGENTIC_UI_API_DOCS=true
      - _APPDIR=/data/appdir
      - INTERNAL_WORKSPACE_ROOT=/data/appdir
      - EXTERNAL_WORKSPACE_ROOT=${HOST_WS_ROOT:-/data/projects/magentic-ui/docker/magui_data}
      - INSIDE_DOCKER=1
      - RUN_WITHOUT_DOCKER=False
      - DATABASE_URI=postgresql+psycopg://postgres:postgres@postgres:5432/magentic_ui
      # Configuration file path (can be overridden by mounting a config file)
      - _CONFIG=${CONFIG_FILE:-/data/config/config.yaml}
    volumes:
      - /data/projects/magentic-ui/docker/magui_data:/data/appdir
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount configuration directory
      - ${CONFIG_DIR:-./config}:/data/config:ro
    expose:
      - "8081"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - my-network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: magentic-ui-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - my-network

  postgres:
    image: postgres:15-alpine
    container_name: magentic-ui-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: magentic_ui
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d magentic_ui"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - my-network

volumes:
  magui_data:
  postgres_data:

networks:
  my-network:
    driver: bridge
    name: my-network
